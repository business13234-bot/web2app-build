name: ios-selftest
run-name: ios-selftest-${{ inputs.variant }}

# Builds a test app with every feature on and drives it on the iOS simulator (tests/ios/UITests).
on:
  workflow_dispatch:
    inputs:
      variant:
        description: Feature option set (a, b; c = features added in 1.2; d = added in 1.4; e = app from a ZIP)
        required: true
        default: a
        type: choice
        options: [a, b, c, d, e]

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  selftest:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      VARIANT: ${{ inputs.variant }}
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Start the test website
        run: |
          TRACKER_HOST=127-0-0-1.nip.io nohup node tests/site/server.mjs 8090 > "$RUNNER_TEMP/site.log" 2>&1 &
          sleep 1
          curl -fsS http://localhost:8090/version.json

      - name: Prepare project with UI tests
        run: |
          REMINDER=$(date -v+30M +%H:%M)
          echo "REMINDER=$REMINDER" >> "$GITHUB_ENV"
          SITE=http://127.0.0.1:8090/ REMINDER=$REMINDER node tests/make-payload.mjs "$VARIANT" "$RUNNER_TEMP/payload.json"
          node scripts/gen-ios.mjs "$RUNNER_TEMP/payload.json" "$RUNNER_TEMP/ios"
          cd "$RUNNER_TEMP/ios"
          sips -s format png icon-source.jpg --out Sources/Assets.xcassets/AppIcon.appiconset/icon.png >/dev/null
          cp -R "$GITHUB_WORKSPACE/tests/ios/UITests" UITests
          node -e '
            const fs = require("fs");
            const spec = JSON.parse(fs.readFileSync("project.json", "utf8"));
            spec.targets.AppUITests = {
              type: "bundle.ui-testing", platform: "iOS", sources: ["UITests"],
              dependencies: [{ target: "App" }],
              settings: { base: { GENERATE_INFOPLIST_FILE: "YES", PRODUCT_BUNDLE_IDENTIFIER: "com.example.w2atest.uitests",
                TEST_TARGET_NAME: "App", SWIFT_VERSION: "5.0", CODE_SIGNING_ALLOWED: "NO" } },
            };
            spec.targets.App.scheme = { testTargets: ["AppUITests"] };
            fs.writeFileSync("project.json", JSON.stringify(spec, null, 2));'
          command -v xcodegen >/dev/null || brew install xcodegen
          xcodegen generate --spec project.json
          xcodebuild -version

      - name: Pick a simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | node -e '
            const d = JSON.parse(require("fs").readFileSync(0, "utf8")).devices;
            const all = Object.entries(d).filter(([k]) => k.includes("iOS")).flatMap(([, v]) => v);
            const pick = all.find((x) => /^iPhone \d+ Pro$/.test(x.name)) || all.find((x) => x.name.startsWith("iPhone"));
            console.log(pick.udid);')
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl ui "$UDID" appearance light
          # Simulated Face ID: enrolled, and a matching face is shown every 2 s while the tests run,
          # so the app lock opens the way it does on a real phone.
          xcrun simctl spawn "$UDID" notifyutil -s com.apple.BiometricKit.enrollmentChanged 1
          xcrun simctl spawn "$UDID" notifyutil -p com.apple.BiometricKit.enrollmentChanged
          nohup bash -c "while true; do xcrun simctl spawn $UDID notifyutil -p com.apple.BiometricKit_Sim.pearl.match; sleep 2; done" >/dev/null 2>&1 &

      - name: Run UI tests
        working-directory: ${{ runner.temp }}/ios
        run: |
          set +e
          TEST=testVariantA; [ "$VARIANT" = b ] && TEST=testVariantB; [ "$VARIANT" = c ] && TEST=testVariantC
          [ "$VARIANT" = d ] && TEST=testVariantD; [ "$VARIANT" = e ] && TEST=testVariantE
          xcodebuild test -project App.xcodeproj -scheme App -destination "id=$UDID" \
            -only-testing:AppUITests/AppUITests/$TEST -resultBundlePath "$RUNNER_TEMP/main.xcresult" \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee "$RUNNER_TEMP/test.log" | grep -E "W2A-|error:|\*\* TEST|Testing failed"
          echo "MAIN_STATUS=${PIPESTATUS[0]}" >> "$GITHUB_ENV"

      - name: Read the app's own report
        run: |
          DATA=$(xcrun simctl get_app_container "$UDID" com.example.w2atest data 2>/dev/null)
          echo "Reminder set for $REMINDER"
          cat "$DATA/Documents/selftest.json" || echo "no selftest.json"

      - name: Dark mode
        if: env.VARIANT == 'a'
        working-directory: ${{ runner.temp }}/ios
        run: |
          set +e
          xcrun simctl ui "$UDID" appearance dark
          xcodebuild test -project App.xcodeproj -scheme App -destination "id=$UDID" \
            -only-testing:AppUITests/AppUITests/testDarkMode -resultBundlePath "$RUNNER_TEMP/dark.xcresult" \
            CODE_SIGNING_ALLOWED=NO 2>&1 | grep -E "W2A-|error:|\*\* TEST"
          xcrun simctl ui "$UDID" appearance light

      - name: Collect screenshots
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/shots"
          for r in main dark; do
            [ -d "$RUNNER_TEMP/$r.xcresult" ] || continue
            xcrun xcresulttool export attachments --path "$RUNNER_TEMP/$r.xcresult" --output-path "$RUNNER_TEMP/shots/$r" || true
          done
          cp "$RUNNER_TEMP/test.log" "$RUNNER_TEMP/site.log" "$RUNNER_TEMP/shots/" 2>/dev/null || true
          ls -R "$RUNNER_TEMP/shots" | head -60

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-selftest-${{ inputs.variant }}
          path: ${{ runner.temp }}/shots
          retention-days: 7

      - name: Result
        run: exit "${MAIN_STATUS:-1}"
