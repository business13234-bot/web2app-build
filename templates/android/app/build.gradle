plugins {
    id 'com.android.application'
}

// Values written by scripts/gen-android.mjs (already validated there).
def cfg = new Properties()
def cfgFile = file('appconfig.properties')
if (cfgFile.exists()) {
    cfgFile.withReader('UTF-8') { cfg.load(it) }
}

def ksFile = System.getenv('W2A_KEYSTORE_FILE')
// Optional features that need extra libraries.
def usePush = cfg.getProperty('push', 'false') == 'true'
def useAds = cfg.getProperty('admob', 'false') == 'true'
if (usePush) {
    apply plugin: 'com.google.gms.google-services'
}

android {
    namespace 'app.web2app.shell'
    compileSdk 36

    defaultConfig {
        applicationId cfg.getProperty('applicationId', 'app.web2app.demo')
        minSdk 24
        targetSdk 36
        versionCode Integer.parseInt(cfg.getProperty('versionCode', '1'))
        versionName cfg.getProperty('versionName', '1.0')
    }

    signingConfigs {
        release {
            if (ksFile) {
                storeFile file(ksFile)
                storePassword System.getenv('W2A_KEYSTORE_PASS')
                keyAlias System.getenv('W2A_KEY_ALIAS')
                keyPassword System.getenv('W2A_KEY_PASS')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (ksFile) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    if (usePush) {
        implementation platform('com.google.firebase:firebase-bom:33.7.0')
        implementation 'com.google.firebase:firebase-messaging'
    }
    if (useAds) {
        implementation 'com.google.android.gms:play-services-ads:23.6.0'
    }
}
